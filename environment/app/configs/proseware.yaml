# Proseware — canonical 30-minute files, German time. Config schema 2 (docs/adr/0007-config-schema-v2.md).
schema: 2
name: Proseware
service:
  interval_minutes: 30
  tz: Europe/Berlin
  operating_hours: [7, 21]
targets:
  sla:
    priority: {target: 0.85, seconds: 20}
